server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Security headers
    # Adjust X-Frame-Options if you need to embed the app in an iframe.
    # -----------------------------------------------------------------------
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "strict-origin"   always;

    # -----------------------------------------------------------------------
    # Long-term cache for hashed/versioned static assets
    # (Quasar/Vite fingerprints JS and CSS filenames automatically)
    # -----------------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # SPA fallback – Quasar uses hash-mode routing so every request lands on
    # index.html and the hash fragment handles navigation client-side.
    # try_files is kept here as a safety net for direct asset requests.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not expose nginx version in error pages
    server_tokens off;
}
